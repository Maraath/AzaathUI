name: Release
on:
  push:
    tags: ['[0-9]*']
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ secrets.CF_PROJECT_ID }} -n "{package-name}-{project-version}:{package-name}-{project-version}"
