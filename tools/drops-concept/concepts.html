function toRgbStr(col) {
  if (!col) return "255,255,255";
  const s = String(col).trim();
  if (s[0] === "#") {
    const h = s.slice(1);
    const n = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
    return `${parseInt(n.slice(0, 2), 16)},${parseInt(n.slice(2, 4), 16)},${parseInt(n.slice(4, 6), 16)}`;
  }
  return s;
}

function glow(g, x, y, r, col, a) {
  const rgb = toRgbStr(col);
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`);
  gr.addColorStop(0.40, `rgba(${rgb},${a * 0.38})`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}

function tw(g, s, font, ls) {
  g.save();
  g.font = font;
  if (ls) g.letterSpacing = ls + "px";
  const w = g.measureText(s).width;
  g.restore();
  return w;
}

function text(g, s, x, y, o = {}) {
  g.save();
  g.font = o.font || "15px PT";
  g.fillStyle = o.color || "#eef2f6";
  g.textAlign = o.align || "left";
  g.textBaseline = o.base || "middle";
  if (o.ls) g.letterSpacing = o.ls + "px";
  g.shadowColor = "rgba(0,0,0,0.95)";
  g.shadowOffsetX = 1.5;
  g.shadowOffsetY = 1.5;
  if (o.glow) {
    g.shadowColor = o.glow;
    g.shadowBlur = o.blur || 10;
    g.shadowOffsetX = 0;
    g.shadowOffsetY = 0;
  }
  g.fillText(s, x, y);
  const w = g.measureText(s).width;
  g.restore();
  return w;
}

  g.restore();
}

// Flood-fill alpha matting a partir das bordas externas (preserva interior escuro opaco!)
function makeCleanPiece(srcImg, box, opts = {}) {
  const pad = opts.pad ?? 4;
  const sx = Math.max(0, box.x - pad), sy = Math.max(0, box.y - pad);
  const sw = Math.min(srcImg.width - sx, box.w + pad * 2);
  const sh = Math.min(srcImg.height - sy, box.h + pad * 2);
  const cv = document.createElement("canvas");
  cv.width = sw; cv.height = sh;
  const cx = cv.getContext("2d");
  cx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
  const id = cx.getImageData(0, 0, sw, sh);
  const d = id.data;
  const vis = new Uint8Array(sw * sh);
  const stack = [];
  for (let x = 0; x < sw; x++) { stack.push(x); stack.push((sh - 1) * sw + x); }
  for (let y = 0; y < sh; y++) { stack.push(y * sw); stack.push(y * sw + (sw - 1)); }
  const isBg = (i) => {
    const o = i * 4;
    return Math.max(d[o], d[o + 1], d[o + 2]) < (opts.thresh || 28);
  };
  while (stack.length) {
    const p = stack.pop();
    if (vis[p] || !isBg(p)) continue;
    vis[p] = 1;
    d[p * 4 + 3] = 0;
    const x = p % sw, y = (p / sw) | 0;
    if (x > 0) stack.push(p - 1);
    if (x < sw - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - sw);
    if (y < sh - 1) stack.push(p + sw);
  }
  // Suavização de 1px na transição externa
  for (let y = 1; y < sh - 1; y++) {
    for (let x = 1; x < sw - 1; x++) {
      const p = y * sw + x;
      if (vis[p]) continue;
      if (vis[p - 1] || vis[p + 1] || vis[p - sw] || vis[p + sw]) {
        const lum = Math.max(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]);
        if (lum < 72) d[p * 4 + 3] = Math.round(d[p * 4 + 3] * Math.max(0.25, lum / 72));
      }
    }
  }
  cx.putImageData(id, 0, 0);

  // Se for mini-card vazado por dentro, preenche o centro com amostra da placa larga do mesmo tema
  if (opts.fillFrom) {
    const out = document.createElement("canvas");
    out.width = sw; out.height = sh;
    const og = out.getContext("2d");
    const fc = opts.fillFrom;
    og.drawImage(fc.img, fc.x, fc.y, fc.w, fc.h, pad + 18, pad + 18, sw - (pad + 18) * 2, sh - (pad + 18) * 2);
    og.drawImage(cv, 0, 0);
    return { cv: out, pad, w: sw, h: sh };
  }
  return { cv, pad, w: sw, h: sh };
}

// 9-slice pintado em alta resolução sem distorcer cantos nem filigranas
function drawPainted9Slice(g, piece, mx, my, sc, X, Y, W_box, H_box, opts = {}) {
  const im = piece.cv;
  const IW = im.width, IH = im.height;
  const ml = mx + piece.pad, mr = mx + piece.pad;
  const mt = my + piece.pad, mb = my + piece.pad;
  const pad = piece.pad * sc;
  const ox = X - pad, oy = Y - pad, OW = W_box + pad * 2, OH = H_box + pad * 2;
  const dl = Math.min(OW * 0.45, ml * sc), dr = Math.min(OW * 0.45, mr * sc);
  const dt = my === 0 ? OH : Math.min(OH * 0.45, mt * sc);
  const db = my === 0 ? 0  : Math.min(OH * 0.45, mb * sc);

  const cols = [
    [0, ml, ox, dl],
    [ml, Math.max(1, IW - ml - mr), ox + dl, Math.max(0, OW - dl - dr)],
    [IW - mr, mr, ox + OW - dr, dr],
  ];
  const rows = my === 0 ? [
    [0, IH, oy, OH],
  ] : [
    [0, mt, oy, dt],
    [mt, Math.max(1, IH - mt - mb), oy + dt, Math.max(0, OH - dt - db)],
    [IH - mb, mb, oy + OH - db, db],
  ];

  g.save();
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  if (opts.alpha != null) g.globalAlpha = opts.alpha;
  for (const [sy, sh, dy, dh] of rows) {
    if (sh <= 0 || dh <= 0) continue;
    for (const [sx, sw, dx, dw] of cols) {
      if (sw <= 0 || dw <= 0) continue;
      if (opts.skipCenter && sy === mt && sx === ml) continue;
      g.drawImage(im, sx, sy, sw, sh, Math.round(dx), Math.round(dy), Math.ceil(dw), Math.ceil(dh));
    }
  }
  g.restore();
}

function drawCapsule(g, T, x, y, w, h, active, tintCol) {
  const st = active ? T.pillAct : T.pillNorm;
  const r = st.chamfer ? 5 : h / 2;
  g.save();
  if (active && st.glow) {
    g.save();
    g.globalCompositeOperation = "lighter";
    glow(g, x + w / 2, y + h / 2, Math.max(w * 0.52, 46), tintCol || st.glow, 0.28);
    g.restore();
  }
  g.beginPath();
  if (st.chamfer) {
    const ch = Math.min(9, h * 0.32);
    g.moveTo(x + ch, y); g.lineTo(x + w - ch, y); g.lineTo(x + w, y + ch);
    g.lineTo(x + w, y + h - ch); g.lineTo(x + w - ch, y + h); g.lineTo(x + ch, y + h);
    g.lineTo(x, y + h - ch); g.lineTo(x, y + ch); g.closePath();
  } else {
    g.roundRect(x, y, w, h, r);
  }
  const fg = g.createLinearGradient(0, y, 0, y + h);
  fg.addColorStop(0, st.top); fg.addColorStop(1, st.bot);
  g.fillStyle = fg;
  g.fill();

  // Reflexo vítreo superior
  g.save();
  g.clip();
  const sg = g.createLinearGradient(0, y, 0, y + h * 0.55);
  sg.addColorStop(0, st.inner); sg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sg;
  g.fillRect(x, y, w, h * 0.55);
  g.restore();

  g.strokeStyle = tintCol && active ? tintCol : st.border;
  g.lineWidth = active ? 1.8 : 1.25;
  g.stroke();

  if (active) {
    const ug = g.createLinearGradient(x + 8, 0, x + w - 8, 0);
    ug.addColorStop(0, "rgba(255,255,255,0)");
    ug.addColorStop(0.5, st.border);
    ug.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = ug;
    g.fillRect(x + 8, y + h - 2, w - 16, 2);
  }
  g.restore();
}

function drawItemMedallion(g, T, cx, cy, sz, helmIdx, qrgb, clean = false) {
  const R = sz * 0.5;
  if (!clean) {
    g.save();
    g.globalCompositeOperation = "lighter";
    glow(g, cx, cy, sz * 0.78, qrgb, 0.34);
    g.restore();
  }
  // Fundo escuro profundo dentro do medalhão
  g.save();
  g.beginPath(); g.arc(cx, cy, R - 2, 0, Math.PI * 2);
  const well = g.createRadialGradient(cx, cy - R * 0.25, 2, cx, cy, R);
  well.addColorStop(0, `rgba(${qrgb},0.28)`);
  well.addColorStop(0.65, "rgba(9,15,24,0.96)");
  well.addColorStop(1, "rgba(3,6,11,0.99)");
  g.fillStyle = well; g.fill();
  g.clip();
  const spr = HELM_SPRITES[helmIdx % HELM_SPRITES.length];
  const isz = sz * 0.88;
  g.drawImage(spr, cx - isz / 2, cy - isz / 2, isz, isz);
  g.restore();

  // Aro chanfrado duplo do estilo do conceito + filete interno da cor da raridade
  g.save();
  g.beginPath(); g.arc(cx, cy, R + 1, 0, Math.PI * 2);
  const rg = g.createLinearGradient(cx, cy - R, cx, cy + R);
  rg.addColorStop(0, T.ringBorder[0]); rg.addColorStop(1, T.ringBorder[1]);
  g.strokeStyle = rg;
  g.lineWidth = clean ? 4.5 : 3;
  g.stroke();

  g.beginPath(); g.arc(cx, cy, R - 2, 0, Math.PI * 2);
  g.strokeStyle = `rgba(${qrgb},0.92)`;
  g.lineWidth = clean ? 2.2 : 1.5;
  g.stroke();
  g.restore();
}

function prepareHelms() {
  const src = RAW_IMGS.Helmets;
  const cw = Math.floor(src.width / 4), ch = Math.floor(src.height / 2);
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 4; col++) {
      const tmp = document.createElement("canvas");
      tmp.width = cw; tmp.height = ch;
      const tx = tmp.getContext("2d");
      tx.drawImage(src, col * cw, row * ch, cw, ch, 0, 0, cw, ch);
      const id = tx.getImageData(0, 0, cw, ch);
      const d = id.data;
      let minX = cw, minY = ch, maxX = 0, maxY = 0;
      for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
        const i = (y * cw + x) * 4;
        const a = Math.max(0, Math.min(1, (Math.max(d[i], d[i + 1], d[i + 2]) - 10) / 24));
        d[i + 3] = Math.round(a * 255);
        if (a > 0.25) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      tx.putImageData(id, 0, 0);
      const bw = Math.max(1, maxX - minX + 1), bh = Math.max(1, maxY - minY + 1);
      const s = Math.max(bw, bh) + 12;
      const out = document.createElement("canvas"); out.width = s; out.height = s;
      out.getContext("2d").drawImage(tmp, minX, minY, bw, bh, (s - bw) / 2, (s - bh) / 2, bw, bh);
      HELM_SPRITES.push(out);
    }
  }
}

function prepareGems() {
  const rg = RAW_IMGS.CraftRings;
  const mk = (key, rgb) => {
    const a = CRAFT_GEMS[key];
    const c = document.createElement("canvas"); c.width = a.w; c.height = a.h;
    const gx = c.getContext("2d"); gx.drawImage(rg, a.x, a.y, a.w, a.h, 0, 0, a.w, a.h);
    if (rgb) {
      const id = gx.getImageData(0, 0, a.w, a.h), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        const lum = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
        const sp = Math.max(0, (lum - 0.65) / 0.35);
        d[i]     = Math.min(255, Math.round(rgb[0] * (0.35 + lum * 0.95) * (1 - sp * 0.6) + 255 * sp * 0.6));
        d[i + 1] = Math.min(255, Math.round(rgb[1] * (0.35 + lum * 0.95) * (1 - sp * 0.6) + 255 * sp * 0.6));
        d[i + 2] = Math.min(255, Math.round(rgb[2] * (0.35 + lum * 0.95) * (1 - sp * 0.6) + 255 * sp * 0.6));
      }
      gx.putImageData(id, 0, 0);
    }
    return c;
  };
  TINTED_GEMS.GemTrivial = mk("GemTrivial", null);
  TINTED_GEMS.GemEasy    = mk("GemEasy", null);
  TINTED_GEMS.GemRare    = mk("GemTrivial", [55, 165, 255]);
  TINTED_GEMS.GemEpic    = mk("GemTrivial", [195, 105, 255]);
}

function prepareThemePieces() {
  for (const k of ["c1", "c2", "c3"]) {
    const T = THEMES[k];
    const img = RAW_IMGS[k];
    const wc = T.wideCrop;
    const fillFrom = T.sqCrop.fillFromWideCenter
      ? { img, x: wc.x + wc.w * 0.25, y: wc.y + wc.h * 0.25, w: wc.w * 0.5, h: wc.h * 0.5 }
      : null;
    CLEAN_PIECES[k] = {
      codex: makeCleanPiece(img, T.codexCrop, { pad: 6 }),
      wide:  makeCleanPiece(img, wc, { pad: 6 }),
      panel: makeCleanPiece(img, T.panelCrop, { pad: 6 }),
      sq:    makeCleanPiece(img, T.sqCrop, { pad: 4, fillFrom }),
      bar:   makeCleanPiece(img, T.barCrop, { pad: 4 }),
      btnC1: k === "c1" ? makeCleanPiece(img, T.codexCrop.btnCrop, { pad: 4 }) : null,
    };
  }
}

function drawChrome(g, T) {
  // 1. Fundo do salão ProfessionsBG + véu sutil para destacar as placas pintadas
  g.imageSmoothingQuality = "high";
  g.drawImage(RAW_IMGS.HallBG, 0, 0, W, H);
  g.fillStyle = "rgba(3,7,12,0.36)";
  g.fillRect(0, 0, W, H);

  let tg = g.createLinearGradient(0, 0, 0, 120);
  tg.addColorStop(0, "rgba(2,5,9,0.92)");
  tg.addColorStop(1, "rgba(2,5,9,0)");
  g.fillStyle = tg; g.fillRect(0, 0, W, 120);

  let bg = g.createLinearGradient(0, H - 70, 0, H);
  bg.addColorStop(0, "rgba(2,5,9,0)");
  bg.addColorStop(1, "rgba(2,5,9,0.90)");
  g.fillStyle = bg; g.fillRect(0, H - 70, W, 70);

function strokeThemeFrame(g, T, x, y, w, h, col, lw) {
  g.save();
  g.strokeStyle = col;
  g.lineWidth = lw;
  g.beginPath();
  if (T.pillNorm.chamfer) {
    const ch = 10;
    g.moveTo(x + ch, y); g.lineTo(x + w - ch, y); g.lineTo(x + w, y + ch);
    g.lineTo(x + w, y + h - ch); g.lineTo(x + w - ch, y + h); g.lineTo(x + ch, y + h);
    g.lineTo(x, y + h - ch); g.lineTo(x, y + ch); g.closePath();
  } else {
    g.roundRect(x, y, w, h, 4);
  }
  g.stroke();
  g.restore();
}

function drawCodex(g, T, pieces) {
  // Disposição EXATA atual à direita: AX = 1400, AW = 486 (c1 sobe a coroa pontuda até y=52 mantendo base em 1054)
  const cc = T.codexCrop;
  const AX = 1400, AY = cc.ay, AW = 486, AH = cc.ah;
  const CX = AX + AW / 2;
  const cd = pieces.codex.cv;
  const cp = pieces.codex.pad;
  const scX = AW / cc.w;

  // 1. Montar moldura vertical completa preservando coroa, placa superior, borda contínua e base sem distorção
  const relY = (absY) => Math.max(0, absY - cc.y + cp);
  const topH = relY(cc.splitTop);
  const topDstH = topH * scX;

  if (T.key === "c1") {
    // Conceito 1: Topo com coroa + placa bronze + corpo limpo + rodapé com borda inferior fechada e 2 botões com gema ciano
    const midY0 = relY(cc.splitTop);
    const midY1 = relY(cc.splitMidEnd);
    const botY0 = relY(cc.splitBotStart);
    const botH  = cd.height - botY0;
    const botDstH = botH * scX;
    const botDstY = AY + AH - botDstH;
    const midDstY = AY + topDstH - 2;
    const midDstH = botDstY - midDstY + 4;

    g.drawImage(cd, cp, 0, cc.w, topH, AX, AY, AW, topDstH);
    g.drawImage(cd, cp, midY0, cc.w, midY1 - midY0, AX, midDstY, AW, midDstH);
    g.drawImage(cd, cp, botY0, cc.w, botH, AX, botDstY, AW, botDstH);

    // Placa no topo
    const plY = AY + relY(cc.plaqueY) * scX;
    text(g, "PLACA  ·  CABEÇA", CX, plY, { font: "11.5px CinzelB", color: T.titleCol, align: "center", ls: 1.5 });
    // Título limpo abaixo da placa
    text(g, "Elmo Coração de Leão", CX, AY + cc.tiYOff, { font: "18.5px CinzelB", color: "#ca84ff", align: "center", glow: "rgba(198,120,255,0.4)", blur: 10 });

    // Botões gêmeos inferiores estilo Infundir Azaath (gemas ciano nas pontas, centro limpo sem emenda)
    const btnY = AY + AH - 68, btnW = 204, btnH = 44;
    drawPainted9Slice(g, pieces.btnC1, T.barCrop.mx, 0, btnH / pieces.btnC1.cv.height, AX + 26, btnY, btnW, btnH);
    drawPainted9Slice(g, pieces.btnC1, T.barCrop.mx, 0, btnH / pieces.btnC1.cv.height, AX + AW - 26 - btnW, btnY, btnW, btnH);
    text(g, "PROVADOR 3D", AX + 26 + btnW / 2, btnY + btnH / 2 + 0.5, { font: "11.5px CinzelB", color: T.goldCol, align: "center", ls: 0.9 });
    text(g, "LINK NO CHAT", AX + AW - 26 - btnW / 2, btnY + btnH / 2 + 0.5, { font: "11.5px CinzelB", color: "#dff6ff", align: "center", ls: 0.9 });
  } else if (T.key === "c2") {
    // Conceito 2: Topo com arco turquesa/filigranas/placa + faixa filigranas sup. + miolo esticado + base com filigranas inf. e 2 botões dourados
    const topDstY = AY;
    const midFilTopY = relY(cc.midFilTop);
    const botStartY  = relY(cc.splitBotStart);
    const filTopH    = midFilTopY - topH;
    const filTopDstH = filTopH * scX;
    const botH       = cd.height - botStartY;
    const botDstH    = botH * scX;
    const botDstY    = AY + AH - botDstH;
    const stretchY   = topDstY + topDstH + filTopDstH - 2;
    const stretchH   = botDstY - stretchY + 4;

    g.drawImage(cd, cp, 0, cc.w, midFilTopY, AX, AY, AW, topDstH + filTopDstH);
    g.drawImage(cd, cp, midFilTopY, cc.w, botStartY - midFilTopY, AX, stretchY, AW, stretchH);
    g.drawImage(cd, cp, botStartY, cc.w, botH, AX, botDstY, AW, botDstH);

    const plY = AY + (cc.plaqueY - cc.y + cp) * scX;
    text(g, "PLACA  ·  CABEÇA", CX, plY, { font: "11.5px CinzelB", color: T.titleCol, align: "center", ls: 1.5 });
    text(g, "Elmo Coração de Leão", CX, AY + cc.tiYOff, { font: "18.5px CinzelB", color: "#ca84ff", align: "center", glow: "rgba(198,120,255,0.4)", blur: 10 });

    const btnY = AY + AH - (cc.y + cc.h + cp - cc.dualBtnY) * scX;
    const lx = AX + (cc.leftBtnX - cc.x + cp) * scX;
    const rx = AX + (cc.rightBtnX - cc.x + cp) * scX;
    text(g, "PROVADOR 3D", lx, btnY, { font: "12px CinzelB", color: "#ffefc4", align: "center", ls: 0.8 });
    text(g, "LINK NO CHAT", rx, btnY, { font: "12px CinzelB", color: "#ffefc4", align: "center", ls: 0.8 });
  } else {
    // Conceito 3: Topo com crista cristal + placa prata + miolo safira + base com botões gêmeos com pontas ciano
    const botStartY = relY(cc.splitBotStart);
    const botH = cd.height - botStartY;
    const botDstH = botH * scX;
    const botDstY = AY + AH - botDstH;
    const midDstY = AY + topDstH - 2;
    const midDstH = botDstY - midDstY + 4;

    g.drawImage(cd, cp, 0, cc.w, topH, AX, AY, AW, topDstH);
    g.drawImage(cd, cp, topH, cc.w, botStartY - topH, AX, midDstY, AW, midDstH);
    g.drawImage(cd, cp, botStartY, cc.w, botH, AX, botDstY, AW, botDstH);

    const plY = AY + (cc.plaqueY - cc.y + cp) * scX;
    text(g, "PLACA  ·  CABEÇA", CX, plY, { font: "11.5px CinzelB", color: "#ffffff", align: "center", ls: 1.5 });
    text(g, "Elmo Coração de Leão", CX, AY + cc.tiYOff, { font: "18.5px CinzelB", color: "#ca84ff", align: "center", glow: "rgba(198,120,255,0.4)", blur: 10 });

    const btnY = AY + AH - (cc.y + cc.h + cp - cc.dualBtnY) * scX;
    const lx = AX + (cc.leftBtnX - cc.x + cp) * scX;
    const rx = AX + (cc.rightBtnX - cc.x + cp) * scX;
    text(g, "PROVADOR 3D", lx, btnY, { font: "11px CinzelB", color: T.goldCol, align: "center", ls: 0.7 });
    text(g, "LINK NO CHAT", rx, btnY, { font: "11px CinzelB", color: "#e6f6ff", align: "center", ls: 0.7 });
  }

  // 2. Medalhão LIMPO sem textura rúnica nem rotação atrás!
  const RCY = AY + cc.rcyOff;
  drawItemMedallion(g, T, CX, RCY, 90, 0, "198,120,255", true);

  // 3. 3 Tags horizontais (ÉPICO | iLvl 61 | REQ. NÍVEL 56)
  const tags = [
    { t: "ÉPICO", w: 84, c: "#ca84ff", on: false },
    { t: "iLvl 61", w: 86, c: T.titleCol, on: false },
    { t: "REQ. NÍVEL 56", w: 122, c: "#ffffff", on: true },
  ];
  const tagY = AY + cc.tagYOff;
  let tx = CX - (84 + 86 + 122 + 16) / 2;
  tags.forEach((tg) => {
    drawCapsule(g, T, tx, tagY, tg.w, 25, tg.on, T.accentCol);
    text(g, tg.t, tx + tg.w / 2, tagY + 12.5, { font: "11px PTB", color: tg.c, align: "center", ls: 0.5 });
    tx += tg.w + 8;
  });

  // 4. Bloco ATRIBUTOS DA RELÍQUIA
  const X0 = AX + 32, W0 = AW - 64;
  const STY = AY + cc.styOff;
  text(g, "◆  ATRIBUTOS DA RELÍQUIA", X0, STY + 7, { font: "11.5px CinzelB", color: T.goldCol, ls: 1 });
  text(g, "▲ +4 iLvl vs. equipado", X0 + W0, STY + 7, { font: "11.5px PTB", color: "#5ce674", align: "right" });

  drawPainted9Slice(g, pieces.wide, T.wideCrop.mx, T.wideCrop.my, 0.36, X0, STY + 20, W0, 148);
  text(g, "Vincula-se ao ser recolhido", X0 + 22, STY + 44, { font: "12px PT", color: "#ffffff" });
  text(g, "565 de Armadura", X0 + 22, STY + 64, { font: "12.5px PTB", color: "#ffffff" });
  text(g, "Placa · Cabeça", X0 + W0 - 22, STY + 64, { font: "12px PT", color: "#dbe6ec", align: "right" });
  text(g, "+18 de Força · +10 de Vigor", X0 + 22, STY + 85, { font: "12.5px PT", color: "#68ee82" });
  g.fillStyle = "rgba(255,255,255,0.08)"; g.fillRect(X0 + 22, STY + 100, W0 - 44, 1);
  text(g, "Equipar: +2% de chance de acerto crítico.", X0 + 22, STY + 118, { font: "12px PT", color: "#4be864" });
  text(g, "Equipar: +2% de chance de atingir um alvo.", X0 + 22, STY + 138, { font: "12px PT", color: "#4be864" });

  // 5. Seção ONDE DROPAR / OBTER (3 cartões pintados + botão MARCAR NO MAPA limpo dentro do cartão)
  const SRY = AY + cc.sryOff;
  text(g, "◆  ONDE DROPAR / OBTER", X0, SRY + 7, { font: "11.5px CinzelB", color: T.accentCol, ls: 1 });
  text(g, "3 fontes", X0 + W0, SRY + 7, { font: "11.5px PT", color: "#9eb2be", align: "right" });

  const srcs = [
    { name: "Ferraria (Nível 300)", loc: "Receita: Instruções: Elmo Coração de Leão", ch: "100%", kind: "craft", icon: "hammer", col: T.goldCol, colRGB: T.goldRGB },
    { name: "[Receita] Elite Mão Negra", loc: "Pico da Rocha Negra  ·  Masmorra", ch: "1.8%", kind: "inst", icon: "great", col: "#ca84ff", colRGB: "198,120,255" },
    { name: "[Receita] Vigia Mão Negra", loc: "Estepes Ardentes  ·  (29.4, 38.2)", ch: "1.4%", kind: "map", icon: "star", col: T.accentCol, colRGB: T.accentRGB },
  ];
  srcs.forEach((s, idx) => {
    const ry = SRY + 20 + idx * 73, rh = 67;
    drawPainted9Slice(g, pieces.wide, T.wideCrop.mx, T.wideCrop.my, 0.34, X0, ry, W0, rh);
    if (s.kind === "map") {
      strokeThemeFrame(g, T, X0 + 2, ry + 2, W0 - 4, rh - 4, T.accentCol, 1.8);
    }
    // Ícone circular
    g.save(); g.beginPath(); g.arc(X0 + 30, ry + rh / 2, 15.5, 0, 7);
    g.fillStyle = "#0b121c"; g.fill();
    g.strokeStyle = s.col; g.lineWidth = 1.8; g.stroke(); g.restore();
    drawWeapon(g, s.icon, X0 + 30, ry + rh / 2, 0.165, s.kind === "star" ? 0 : 0.45, s.col);

    text(g, s.name, X0 + 54, ry + 21, { font: "12.5px PTB", color: "#f6efe0" });
    text(g, s.loc, X0 + 54, ry + 45, { font: "11.5px PT", color: s.col });

    const is100 = s.ch === "100%";
    drawCapsule(g, T, X0 + W0 - 64, ry + 8, 52, 20, !is100, T.goldCol);
    text(g, s.ch, X0 + W0 - 38, ry + 18, { font: "10.5px PTB", color: is100 ? T.goldCol : T.accentCol, align: "center" });

    if (s.kind === "map") {
      const bw = 122, bh = 22, bx = X0 + W0 - bw - 12, by = ry + 35;
      drawCapsule(g, T, bx, by, bw, bh, true, T.accentCol);
      text(g, "MARCAR NO MAPA", bx + bw / 2, by + bh / 2, { font: "9px CinzelB", color: "#ffffff", align: "center", ls: 0.4 });
    }
  });
}

function renderConcept(canvasId, themeKey) {
  const cv = document.getElementById(canvasId);
  const g = cv.getContext("2d");
  const T = THEMES[themeKey];
  const pieces = CLEAN_PIECES[themeKey];
  drawChrome(g, T);
  drawCatalog(g, T, pieces);
  drawCodex(g, T, pieces);
}

// Prancha comparativa em close-up 1:1 para decidir com clareza
function renderComparison() {
  const cv = document.getElementById("cmp");
  const g = cv.getContext("2d");
  g.fillStyle = "#060a12";
  g.fillRect(0, 0, cv.width, cv.height);

  text(g, "COMPARATIVO DE TEXTURAS  ·  O RELICÁRIO DE AZAATH", 1050, 40, { font: "24px CinzelB", color: "#ffe8a6", align: "center", ls: 2 });
  text(g, "Mesma disposição atual com 3 linguagens de texturas pintadas à mão — zero animação/roda atrás do item", 1050, 68, { font: "13px PT", color: "#9eb4c2", align: "center" });

  const keys = ["c1", "c2", "c3"];
  const colW = 660, startX = 40, colGap = 20;
  keys.forEach((k, idx) => {
    const T = THEMES[k];
    const srcCv = document.getElementById(k);
    const bx = startX + idx * (colW + colGap);

    // Moldura externa da coluna de comparação
    g.save();
    g.fillStyle = "#0a101b"; g.fillRect(bx, 96, colW, 1196);
    g.strokeStyle = T.goldCol; g.lineWidth = 1.5; g.strokeRect(bx, 96, colW, 1196);
    g.restore();

    text(g, T.name, bx + colW / 2, 124, { font: "14px CinzelB", color: T.titleCol, align: "center", ls: 0.6 });
    text(g, T.sub, bx + colW / 2, 146, { font: "11.5px PT", color: "#9bb0be", align: "center" });

    // 1. 3 Mini-cards de filtro completos (Todos / Placa selecionado / Malha)
    text(g, "MINI-CARDS DE FILTRO", bx + 20, 174, { font: "11px CinzelB", color: T.accentCol, ls: 1 });
    g.drawImage(srcCv, 54, 206, 437, 78, bx + 20, 188, colW - 40, 108);

    // 2. Card de item selecionado + card normal recortados da grade
    text(g, "CARDS DE ITENS DO RELICÁRIO", bx + 20, 314, { font: "11px CinzelB", color: T.accentCol, ls: 1 });
    g.drawImage(srcCv, 490, 366, 434, 328, bx + 20, 328, 444, 336);

    // Miniatura de contexto da borda do Card Geral com fade elegante nas bordas
    const gx = bx + 474, gy = 328, gw = 166, gh = 166;
    g.drawImage(srcCv, 30, 100, 195, 195, gx, gy, gw, gh);
    const fr = g.createLinearGradient(gx + gw - 36, 0, gx + gw, 0);
    fr.addColorStop(0, "rgba(10,16,27,0)"); fr.addColorStop(1, "#0a101b");
    g.fillStyle = fr; g.fillRect(gx + gw - 36, gy, 36, gh);
    const fb = g.createLinearGradient(0, gy + gh - 36, 0, gy + gh);
    fb.addColorStop(0, "rgba(10,16,27,0)"); fb.addColorStop(1, "#0a101b");
    g.fillStyle = fb; g.fillRect(gx, gy + gh - 36, gw, 36);
    text(g, "Borda Geral", gx + gw / 2, gy + gh + 16, { font: "10.5px PT", color: T.goldCol, align: "center" });

    // 3. Card Direito completo em destaque (capturando coroa completa em qualquer conceito)
    text(g, "CARD DO ITEM SELECIONADO (CÓDICE)", bx + colW / 2, 680, { font: "11px CinzelB", color: T.accentCol, align: "center", ls: 1 });
    const cc = T.codexCrop;
    const maxH = 592;
    const sc = Math.min(318 / 486, maxH / cc.ah);
    const cw = Math.round(486 * sc), ch = Math.round(cc.ah * sc);
    const dx = bx + Math.round((colW - cw) / 2);
    const dy = 692 + Math.round((maxH - ch) / 2);
    g.drawImage(srcCv, 1400, cc.ay, 486, cc.ah, dx, dy, cw, ch);
    if (k === "c1") {
      g.fillStyle = "#0a101b";
      g.fillRect(dx + Math.round(cw * 0.78), dy, Math.ceil(cw * 0.22), Math.ceil(ch * 0.055));
    }
  });
}

const FONTS = ["24px CinzelB", "22px Cinzel", "16px PTB", "16px PT"];
function loadImg(src) {
  return new Promise((ok, no) => {
    const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src;
  });
}

Promise.all([
  ...Object.entries(ASSETS).map(([k, v]) => loadImg(v).then((im) => { RAW_IMGS[k] = im; })),
  ...FONTS.map((f) => document.fonts.load(f)),
]).then(() => {
  prepareHelms();
  prepareGems();
  prepareThemePieces();

  renderConcept("c1", "c1");
  renderConcept("c2", "c2");
  renderConcept("c3", "c3");
  renderComparison();

  const pre = document.createElement("pre");
  pre.id = "out";
  pre.textContent = JSON.stringify({
    c1:  document.getElementById("c1").toDataURL("image/png"),
    c2:  document.getElementById("c2").toDataURL("image/png"),
    c3:  document.getElementById("c3").toDataURL("image/png"),
    cmp: document.getElementById("cmp").toDataURL("image/png"),
  });
  document.body.appendChild(pre);
}).catch((e) => {
  const pre = document.createElement("pre");
  pre.textContent = "ERRO: " + (e && e.stack || e);
  document.body.appendChild(pre);
});
