const IMGS = {};
const HELM_SPRITES = [];
const TINTED_GEMS = {};
let CODEX_CLEAN = null;

function glow(x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`);
  gr.addColorStop(0.38, `rgba(${col},${a * 0.42})`);
  gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}

function tw(s, font, ls) {
  g.save();
  g.font = font;
  if (ls) g.letterSpacing = ls + "px";
  const w = g.measureText(s).width;
  g.restore();
  return w;
}

function text(s, x, y, o = {}) {
  g.save();
  g.font = o.font || "16px PT";
  g.fillStyle = o.color || "#e8e2d2";
  g.textAlign = o.align || "left";
  g.textBaseline = o.base || "middle";
  if (o.ls) g.letterSpacing = o.ls + "px";
  g.shadowColor = "rgba(0,0,0,0.92)";
  g.shadowOffsetX = 1.5;
  g.shadowOffsetY = 1.5;
  if (o.glow) {
    g.shadowColor = o.glow;
    g.shadowBlur = o.blur || 12;
    g.shadowOffsetX = 0;
    g.shadowOffsetY = 0;
  }
  g.fillText(s, x, y);
  const w = g.measureText(s).width;
  g.restore();
  return w;
}

function drawWeapon(kind, x, y, s, ang, fill, stroke, lw) {
  g.save();
  g.translate(x, y);
  g.rotate(ang || 0);
  g.scale(s, s);
  g.beginPath();
  WEAPON[kind](g);
  if (fill) { g.fillStyle = fill; g.fill("nonzero"); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 1.4) / s; g.stroke(); }
  g.restore();
}

function drawSprite(key, dx, dy, dw, dh, alpha = 1) {
  const a = ATLAS[key];
  const img = IMGS[a.file];
  g.save();
  if (alpha < 1) g.globalAlpha = alpha;
  if (a.add) g.globalCompositeOperation = "lighter";
  g.drawImage(img, a.x, a.y, a.w, a.h, dx, dy, dw, dh);
  g.restore();
}

// 9-slice real fiel a Professions.lua H.Skin
function drawFrame(key, X, Y, W_box, H_box, scaleOverride, opts = {}) {
  const a = ATLAS[key];
  const img = IMGS[a.file];
  const [m0, m1, m2, m3] = a.m;
  const s = scaleOverride || (m1 === 0 && m3 === 0 ? H_box / (a.h - a.pad * 2) : 0.65);
  const pad = a.pad * s;
  const ml = m0 + a.pad, mt = m1 + a.pad, mr = m2 + a.pad, mb = m3 + a.pad;
  const ox = X - pad, oy = Y - pad, OW = W_box + pad * 2, OH = H_box + pad * 2;
  const dl = ml * s, dt = mt * s, dr = mr * s, db = mb * s;

  const cols = [
    [a.x, ml, ox, dl],
    [a.x + ml, a.w - ml - mr, ox + dl, OW - dl - dr],
    [a.x + a.w - mr, mr, ox + OW - dr, dr],
  ];
  const rows = [
    [a.y, mt, oy, dt],
    [a.y + mt, a.h - mt - mb, oy + dt, OH - dt - db],
    [a.y + a.h - mb, mb, oy + OH - db, db],
  ];

  g.save();
  if (opts.alpha != null) g.globalAlpha = opts.alpha;
  for (const [sy, sh, dy, dh] of rows) {
    if (sh <= 0 || dh <= 0) continue;
    for (const [sx, sw, dx, dw] of cols) {
      if (sw <= 0 || dw <= 0) continue;
      g.drawImage(img, sx, sy, sw, sh, Math.round(dx), Math.round(dy), Math.ceil(dw), Math.ceil(dh));
    }
  }
  g.restore();

  if (opts.diamond && (key === "CardN" || key === "WideN")) {
    const d = ATLAS.Diamond;
    const ds = Math.max(0.55, s);
    drawSprite("Diamond", X + W_box / 2 - (d.w * ds) / 2, Y - (d.h * ds) / 2, d.w * ds, d.h * ds);
    drawSprite("Diamond", X + W_box / 2 - (d.w * ds) / 2, Y + H_box - (d.h * ds) / 2, d.w * ds, d.h * ds);
  }
  const flKey = key + "Flare";
  if (ATLAS[flKey] && !opts.noFlare) {
    const fl = ATLAS[flKey];
    const fs = Math.max(0.68, s);
    drawSprite(flKey, X + W_box / 2 - (fl.w * fs) / 2, Y - fl.cy * fs, fl.w * fs, fl.h * fs);
  }
}

// Pré-processa os 8 elmos pintados removendo o preto sólido para fundo transparente
function prepareHelmSprites() {
  const src = IMGS.Helmets;
  const cw = Math.floor(src.width / 4), ch = Math.floor(src.height / 2);
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 4; col++) {
      const tmp = document.createElement("canvas");
      tmp.width = cw; tmp.height = ch;
      const tx = tmp.getContext("2d");
      tx.drawImage(src, col * cw, row * ch, cw, ch, 0, 0, cw, ch);
      const id = tx.getImageData(0, 0, cw, ch);
      const d = id.data;
      let minX = cw, minY = ch, maxX = 0, maxY = 0;
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const i = (y * cw + x) * 4;
          const r = d[i], gg = d[i + 1], b = d[i + 2];
          const mx = Math.max(r, gg, b);
          const a = Math.max(0, Math.min(1, (mx - 10) / 24));
          d[i + 3] = Math.round(a * 255);
          if (a > 0.25) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      tx.putImageData(id, 0, 0);
      const bw = Math.max(1, maxX - minX + 1), bh = Math.max(1, maxY - minY + 1);
      const sz = Math.max(bw, bh) + 12;
      const out = document.createElement("canvas");
      out.width = sz; out.height = sz;
      const ox = out.getContext("2d");
      ox.drawImage(tmp, minX, minY, bw, bh, (sz - bw) / 2, (sz - bh) / 2, bw, bh);
      HELM_SPRITES.push(out);
    }
  }
}

// Cria versões colorizadas da gema cristalina GemTrivial para Raro (azul) e Épico (roxo)
function prepareTintedGem(name, targetRGB) {
  const a = ATLAS.GemTrivial;
  const cvG = document.createElement("canvas");
  cvG.width = a.w; cvG.height = a.h;
  const gx = cvG.getContext("2d");
  gx.drawImage(IMGS.CraftRings, a.x, a.y, a.w, a.h, 0, 0, a.w, a.h);
  const id = gx.getImageData(0, 0, a.w, a.h);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    const lum = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
    // Preserva os brilhos especulares altos em branco, colore o corpo facetado
    const spec = Math.max(0, (lum - 0.65) / 0.35);
    d[i]     = Math.min(255, Math.round(targetRGB[0] * (0.35 + lum * 0.95) * (1 - spec * 0.6) + 255 * spec * 0.6));
    d[i + 1] = Math.min(255, Math.round(targetRGB[1] * (0.35 + lum * 0.95) * (1 - spec * 0.6) + 255 * spec * 0.6));
    d[i + 2] = Math.min(255, Math.round(targetRGB[2] * (0.35 + lum * 0.95) * (1 - spec * 0.6) + 255 * spec * 0.6));
  }
  gx.putImageData(id, 0, 0);
  TINTED_GEMS[name] = cvG;
}

// Remove o fundo azul-marinho opaco (#0a101c) ao redor da coroa e bordas externas de card.png
function prepareCodexCard() {
  const src = IMGS.CodexCard;
  const Wc = src.width, Hc = src.height;
  const cvC = document.createElement("canvas");
  cvC.width = Wc; cvC.height = Hc;
  const cx = cvC.getContext("2d");
  cx.drawImage(src, 0, 0);
  const id = cx.getImageData(0, 0, Wc, Hc);
  const d = id.data;
  // Flood-fill a partir dos cantos superiores e laterais fora da silhueta da coroa/card
  const vis = new Uint8Array(Wc * Hc);
  const stack = [0, Wc - 1, (Hc - 1) * Wc, Hc * Wc - 1];
  const isSky = (i) => {
    const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, gg, b);
    return mx < 46 && (b - r) < 28;
  };
  while (stack.length) {
    const p = stack.pop();
    if (vis[p]) continue;
    const x = p % Wc, y = (p / Wc) | 0;
    // Não entra dentro do retângulo principal do card (15..545, 165..1030) nem dos botões (15..545, 1022..1084)
    if (x >= 16 && x <= Wc - 17 && y >= 166 && y <= 1030) continue;
    if (!isSky(p)) continue;
    vis[p] = 1;
    d[p * 4 + 3] = 0;
    if (x > 0) stack.push(p - 1);
    if (x < Wc - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - Wc);
    if (y < Hc - 1) stack.push(p + Wc);
  }
  // Suaviza 1px de anti-alias ao redor dos pixels removidos
  for (let y = 1; y < Hc - 1; y++) {
    for (let x = 1; x < Wc - 1; x++) {
      const p = y * Wc + x;
      if (vis[p]) continue;
      if (vis[p - 1] || vis[p + 1] || vis[p - Wc] || vis[p + Wc]) {
        const mx = Math.max(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]);
        if (mx < 75) d[p * 4 + 3] = Math.round(d[p * 4 + 3] * 0.45);
      }
    }
  }
  cx.putImageData(id, 0, 0);
  CODEX_CLEAN = cvC;
}

function drawHelmMedallion(cx, cy, ringSize, helmIdx, qrgb, ringKey = "RingSmall", active = false) {
  g.save();
  g.globalCompositeOperation = "lighter";
  glow(cx, cy, ringSize * (active ? 0.95 : 0.72), qrgb, active ? 0.42 : 0.25);
  g.restore();

  // Poço escuro circular atrás do ícone
  const holeR = ringSize * (ringKey === "RingBronze" ? 0.34 : ringKey === "RingDark" ? 0.35 : 0.38);
  g.save();
  g.beginPath();
  g.arc(cx, cy, holeR, 0, Math.PI * 2);
  const bg = g.createRadialGradient(cx, cy - holeR * 0.25, 2, cx, cy, holeR);
  bg.addColorStop(0, `rgba(${qrgb},0.34)`);
  bg.addColorStop(0.65, "rgba(10,18,26,0.95)");
  bg.addColorStop(1, "rgba(3,7,11,0.99)");
  g.fillStyle = bg;
  g.fill();
  g.clip();
  const spr = HELM_SPRITES[helmIdx];
  const isz = holeR * 1.88;
  g.drawImage(spr, cx - isz / 2, cy - isz / 2, isz, isz);
  g.restore();

  // Aro de raridade sutil + aro esculpido da arte (RingSmall / RingBronze / RingDark)
  g.save();
  g.beginPath();
  g.arc(cx, cy, holeR + 1, 0, Math.PI * 2);
  g.strokeStyle = `rgba(${qrgb},0.85)`;
  g.lineWidth = 1.6;
  g.stroke();
  g.restore();

  drawSprite(ringKey, cx - ringSize / 2, cy - ringSize / 2, ringSize, ringSize);
}

function background() {
  // 1. Salão rúnico real de Ofícios (ProfessionsBG / bg_1920x1080)
  g.imageSmoothingQuality = "high";
  g.drawImage(IMGS.HallBG, 0, 0, W, H);

  // Véu escuro à esquerda para máxima legibilidade do catálogo
  let lg = g.createLinearGradient(0, 0, 1180, 0);
  lg.addColorStop(0, "rgba(3,8,13,0.90)");
  lg.addColorStop(0.82, "rgba(4,10,16,0.82)");
  lg.addColorStop(1, "rgba(4,10,16,0.18)");
  g.fillStyle = lg;
  g.fillRect(0, 0, 1180, H);

  // 2. Palco central-direito do Provador 3D (x = 980..1530) — Guerreiro no Pedestal Rúnico
  const WX = 1260, WY = 516, WW = 500, WH = 668;
  // Máscara suave elíptica para fundir o guerreiro e o pedestal perfeitamente ao salão
  const off = document.createElement("canvas");
  off.width = WW; off.height = WH;
  const ox = off.getContext("2d");
  ox.drawImage(IMGS.Warrior, 0, 0, WW, WH);
  ox.globalCompositeOperation = "destination-in";
  const mg = ox.createRadialGradient(WW * 0.5, WH * 0.50, WW * 0.22, WW * 0.5, WH * 0.50, WW * 0.56);
  mg.addColorStop(0, "rgba(255,255,255,1)");
  mg.addColorStop(0.70, "rgba(255,255,255,0.94)");
  mg.addColorStop(0.92, "rgba(255,255,255,0.22)");
  mg.addColorStop(1, "rgba(255,255,255,0)");
  ox.fillStyle = mg;
  ox.fillRect(0, 0, WW, WH);

  // Brilho de LootBeam atrás do personagem
  g.save();
  g.globalCompositeOperation = "lighter";
  glow(WX, WY - 80, 320, "140,105,255", 0.16);
  glow(WX, WY + 210, 260, "95,214,208", 0.22);
  g.restore();

  g.drawImage(off, WX - WW / 2, WY - WH / 2 + 46);

  // Degradê escuro no topo (cabeçalho) e rodapé
  let tg = g.createLinearGradient(0, 0, 0, 150);
  tg.addColorStop(0, "rgba(2,5,9,0.94)");
  tg.addColorStop(0.65, "rgba(2,5,9,0.62)");
  tg.addColorStop(1, "rgba(2,5,9,0)");
  g.fillStyle = tg;
  g.fillRect(0, 0, W, 150);

  let bg = g.createLinearGradient(0, H - 120, 0, H);
  bg.addColorStop(0, "rgba(2,5,9,0)");
  bg.addColorStop(1, "rgba(2,5,9,0.90)");
  g.fillStyle = bg;
  g.fillRect(0, H - 120, W, 120);
}

function drawHeader() {
  // Retrato do personagem
  g.save();
  g.beginPath(); g.arc(68, 48, 30, 0, 7);
  const av = g.createRadialGradient(64, 42, 3, 68, 48, 30);
  av.addColorStop(0, "#2f4e62"); av.addColorStop(1, "#0b1620");
  g.fillStyle = av; g.fill();
  g.clip();
  const pg = g.createLinearGradient(0, 18, 0, 82);
  pg.addColorStop(0, "#a8c0d0"); pg.addColorStop(1, "#2a3c4a");
  g.fillStyle = pg;
  g.beginPath(); g.arc(68, 43, 11, 0, 7); g.fill();
  g.beginPath(); g.ellipse(68, 78, 22, 19, 0, 0, 7); g.fill();
  g.restore();
  drawSprite("RingSmall", 68 - 42, 48 - 42, 84, 84);

  text("MARAATH", 114, 37, { font: "25px Cinzel", color: "#f3f6f8", ls: 1 });
  text("NÍVEL 60 ELFO NOTURNO GUERREIRO", 115, 61, { font: "11px Cinzel", color: "#b6c4cc", ls: 1 });

  const tabs = ["SANTUÁRIO", "GRIMÓRIO", "TALENTOS", "OFÍCIOS", "DROPS", "REPUTAÇÃO", "PERÍCIAS", "GLADIADOR", "TESOURO", "CRÔNICAS"];
  const gap = 25;
  const ws = tabs.map((t) => tw(t, "13.5px Cinzel", 1.1));
  const totalW = ws.reduce((a, b) => a + b, 0) + gap * (tabs.length - 1);
  let tx = 1120 - totalW / 2;

  const hlg = g.createLinearGradient(tx - 16, 0, tx + totalW + 16, 0);
  hlg.addColorStop(0, "rgba(140,220,245,0)");
  hlg.addColorStop(0.5, "rgba(140,220,245,0.28)");
  hlg.addColorStop(1, "rgba(140,220,245,0)");
  g.fillStyle = hlg;
  g.fillRect(tx - 16, 54, totalW + 32, 1.5);

  tabs.forEach((t, i) => {
    const act = t === "DROPS";
    text(t, tx, 39, {
      font: "13.5px Cinzel",
      color: act ? "#ffffff" : "#9aa6ae",
      ls: 1.1,
      glow: act ? "#7fe0ff" : null,
      blur: 14,
    });
    if (act) {
      const cx = tx + ws[i] / 2;
      g.save();
      g.globalCompositeOperation = "lighter";
      glow(cx, 54, 52, "120,225,255", 0.55);
      const fl = g.createLinearGradient(cx - 72, 0, cx + 72, 0);
      fl.addColorStop(0, "rgba(140,235,255,0)");
      fl.addColorStop(0.5, "rgba(210,248,255,0.95)");
      fl.addColorStop(1, "rgba(140,235,255,0)");
      g.fillStyle = fl;
      g.fillRect(cx - 72, 53, 144, 2.5);
      g.restore();
      g.save();
      g.strokeStyle = "#b5f2ff";
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(cx - 5, 67); g.lineTo(cx, 61); g.lineTo(cx + 5, 67);
      g.stroke();
      g.restore();
    }
    tx += ws[i] + gap;
  });

  // Orbe Poder de Item com RingDark esculpido
  drawSprite("RingDark", 1916 - 38, 46 - 38, 76, 76);
  text("64", 1916, 46, { font: "20px Cinzel", color: "#d4f5ff", align: "center" });
  text("PODER DE ITEM", 1916, 84, { font: "9.5px Cinzel", color: "#a8b4ba", align: "center", ls: 1 });
}

function drawCatalogPanel() {
  const PX = 36, PY = 104, PW = 1002, PH = 950;
  // Painel principal esculpido com CardN em 9-slice + preenchimento escuro legível
  g.save();
  g.fillStyle = "rgba(4,10,16,0.74)";
  g.fillRect(PX + 10, PY + 10, PW - 20, PH - 20);
  g.restore();
  drawFrame("CardN", PX, PY, PW, PH, 0.70, { alpha: 0.72 });

  const X0 = PX + 26, W0 = PW - 52; // 62 .. 1012 (950 px)

  // Título + cascata ativa

const FONTS = ["28px Cinzel", "22px CinzelB", "16px PT", "16px PTB", "14px Fell"];
function loadImg(src) {
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = no;
    im.src = src;
  });
}

Promise.all([
  ...Object.entries(ASSETS).map(([k, v]) => loadImg(v).then((im) => { IMGS[k] = im; })),
  ...FONTS.map((f) => document.fonts.load(f)),
]).then(() => {
  prepareHelmSprites();
  prepareCodexCard();
  prepareTintedGem("GemRare", [55, 165, 255]);
  prepareTintedGem("GemEpic", [195, 105, 255]);

  background();
  drawHeader();
  drawCatalogPanel();
  drawProvador3D();
  drawRelicCodex();
  drawFooter();

  const pre = document.createElement("pre");
  pre.id = "out";
  pre.textContent = cv.toDataURL("image/png");
  document.body.appendChild(pre);
}).catch((e) => {
  const pre = document.createElement("pre");
  pre.textContent = "ERRO: " + (e && e.stack || e);
  document.body.appendChild(pre);
});
