<script>
// Arte de conceito da aba Perícias: "O Vórtice do Arsenal" (fundo em epic.js).
//   art.html?mode=bg   -> só o fundo
//   art.html?mode=full -> fundo + interface
const W = 2000, H = 1125;
const MODE = new URLSearchParams(location.search).get("mode") || "full";
const cv = document.getElementById("c"), g = cv.getContext("2d");

// ---------- utilidades ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash(x, y, s) { let h = x * 374761393 + y * 668265263 + s * 2147483647; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u), lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u), v);
}
function fbm(x, y, s, oct = 5) { let a = 0.5, f = 1, t = 0, n = 0; for (let i = 0; i < oct; i++) { t += a * vnoise(x * f, y * f, s + i * 31); n += a; a *= 0.5; f *= 2.03; } return t / n; }
function noiseLayer(w, h, fn) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"), id = x.createImageData(w, h), d = id.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = (j * w + i) * 4; const [r, gg, b, a] = fn(i, j); d[k] = r; d[k + 1] = gg; d[k + 2] = b; d[k + 3] = a; }
  x.putImageData(id, 0, 0); return c;
}
function glow(x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.35, `rgba(${col},${a * 0.45})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function pointedArch(cx, top, w, base) { // arco gótico
  const r = w * 0.85;
  g.moveTo(cx - w / 2, base); g.lineTo(cx - w / 2, top + r * 0.62);
  g.quadraticCurveTo(cx - w / 2, top + r * 0.12, cx, top);
  g.quadraticCurveTo(cx + w / 2, top + r * 0.12, cx + w / 2, top + r * 0.62);
  g.lineTo(cx + w / 2, base);
}

function drawWeapon(kind, x, y, s, ang, fill, stroke, lw) {
  g.save(); g.translate(x, y); g.rotate(ang || 0); g.scale(s, s);
  g.beginPath(); WEAPON[kind](g);
  if (fill) { g.fillStyle = fill; g.fill(kind === "hook" || kind === "pan" ? "nonzero" : "nonzero"); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 1.4) / s; g.stroke(); }
  g.restore();
}

// ---------- runas ----------
const RP = [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2], [1, 2], [0.5, 1]];
function rune(x, y, h, col, a, lw) {
  const k = Math.floor(rnd() * 1e6); const loc = () => (seed = (seed * 16807) % 2147483647);
  g.save(); g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = lw || 2; g.lineCap = "round"; g.shadowColor = `rgba(${col},${a})`; g.shadowBlur = h * 0.6;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + h);
  const n = 2 + Math.floor(rnd() * 2);
  for (let i = 0; i < n; i++) { const p = RP[Math.floor(rnd() * RP.length)], q = RP[Math.floor(rnd() * RP.length)]; if (p === q) continue;
    g.moveTo(x + p[0] * h * 0.5, y + p[1] * h * 0.5); g.lineTo(x + q[0] * h * 0.5, y + q[1] * h * 0.5); }
  g.stroke(); g.restore();
}

// FUNDO: background() fica em epic.js

// =====================================================================
//                               INTERFACE
// =====================================================================
// INTERFACE: ui() fica em ui.js (versão 2: páginas + cards)

const FONTS = ["30px Cinzel", "17px CinzelB", "17px PT", "17px PTB", "16px Fell"];

<script>
const STAGE_IMG = new Image(); STAGE_IMG.src = STAGE;
Promise.all([new Promise((ok, no) => { if (STAGE_IMG.complete && STAGE_IMG.naturalWidth) ok(); else { STAGE_IMG.onload = ok; STAGE_IMG.onerror = no; } }), ...FONTS.map((f) => document.fonts.load(f))]).then(() => {

  if (MODE === "full") ui();
  const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = cv.toDataURL("image/png"); document.body.appendChild(pre);
